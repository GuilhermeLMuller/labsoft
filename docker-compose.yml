services:
  backend:
    build:
      context: ./labsoft-banco_de_dados/meu-projeto
      dockerfile: Dockerfile.backend
    env_file:
      - ./labsoft-banco_de_dados/meu-projeto/backend/.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./labsoft-banco_de_dados/meu-projeto
      dockerfile: Dockerfile.frontend
    ports:
      - "8443:8443"
    depends_on:
      - backend
